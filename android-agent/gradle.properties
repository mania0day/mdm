org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Build with a JDK this Gradle/Kotlin toolchain understands. This machine's
# default JDK is 25, which the bundled Kotlin compiler cannot parse (build dies
# with a cryptic "25.0.4"). Android Studio's bundled JBR is JDK 21 — use it.
# Change this path if Android Studio lives elsewhere, or point it at any JDK 17/21.
org.gradle.java.home=/opt/android-studio/jbr
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
